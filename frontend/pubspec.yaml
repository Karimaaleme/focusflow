name: my_journal_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Storage
  flutter_secure_storage: ^9.0.0

  # Logging
  path_provider: ^2.1.4

  # UI & Utils
  google_fonts: ^6.1.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  table_calendar: ^3.0.9
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  share_plus: ^10.0.0
  pdf: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
